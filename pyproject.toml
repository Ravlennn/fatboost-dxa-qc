[project]
name = "dxaqc"
version = "0.1.0"
description = "Контроль качества DXA-денситометрии по DICOM (хакатон ДепЗдрав 2026)"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pillow>=11.3.0",
    "pydicom>=3.0.1",
    "pylibjpeg>=2.0.1",
    "pylibjpeg-libjpeg>=2.3.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
dxaqc = "dxaqc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxaqc"]
